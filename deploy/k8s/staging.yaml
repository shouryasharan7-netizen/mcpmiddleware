apiVersion: v1
kind: Namespace
metadata:
  name: secure-mcp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: secure-mcp
data:
  MCP_GATEWAY_HOST: "0.0.0.0"
  MCP_GATEWAY_PORT: "8080"
  MCP_GATEWAY_DB: "/var/lib/mcp/gateway.sqlite3"
  MCP_GATEWAY_AUDIT: "/var/lib/mcp/audit.jsonl"
  MCP_REDIS_URL: "redis://redis:6379/0"
  MCP_SESSION_TTL_SECONDS: "3600"
  MCP_OIDC_ISSUER: "https://identity.example.invalid/"
  MCP_OIDC_AUDIENCE: "mcp-gateway"
  MCP_OIDC_JWKS_URI: "https://identity.example.invalid/.well-known/jwks.json"
  MCP_ROLE_MAP: '{"mcp.admin":["Gateway-Admins"],"mcp.engineer":["Engineering"]}'
  OTEL_SERVICE_NAME: "secure-mcp-gateway"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: secure-mcp
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: secure-mcp
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: secure-mcp
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-headless
  namespace: secure-mcp
spec:
  clusterIP: None
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: secure-mcp
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gateway
  namespace: secure-mcp
spec:
  serviceName: gateway-headless
  # Keep one writer while registry and audit use SQLite. Move those stores to
  # a shared transactional database before increasing this replica count.
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: gateway
          image: secure-mcp-gateway:staging
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-secrets
                optional: true
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mcp
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
